[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computer_manager"
version = "0.1.0"
description = "Computer Manager — display, audio, network adapter, and drive management for XTray"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arrigo Croce" }]
dependencies = [
    "monitorcontrol>=4.2; platform_system == 'Windows'",
    "pywin32>=311; platform_system == 'Windows'",
    "xtray>=0.1.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
computer-manager = "computer_manager.app:main"

[tool.setuptools.packages.find]
include = ["computer_manager*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_display: hardware-in-the-loop display topology tests; require XTRAY_LIVE_DISPLAY_TESTS=1",
]
