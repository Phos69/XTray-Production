[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "network-manager"
version = "0.1.0"
description = "Desktop GUI to manage DHCP / static reservations on TIM router web UIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Phos69" }]
keywords = ["huawei", "dn8245x6", "technicolor", "agmy2020", "netgear", "ex6120", "dhcp", "router", "network", "tim"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]
dependencies = [
    "xtray>=0.1.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
experimental = ["keyring>=24", "requests>=2.31"]
dev = [
    "keyring>=24",
    "ruff>=0.4",
    "pytest>=7",
    "requests>=2.31",
]

[project.scripts]
network-manager = "network_manager.gui_entry:main"
network-manager-devices = "network_manager.device_manager.manager:main"

[project.urls]
Homepage = "https://github.com/Phos69/network-manager"
Documentation = "https://github.com/Phos69/network-manager#readme"
Issues = "https://github.com/Phos69/network-manager/issues"

[tool.setuptools.packages.find]
include = ["network_manager*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
